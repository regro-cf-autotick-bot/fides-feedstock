{% set name = "fides" %}
{% set version = "0.8.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/fides-{{ version }}.tar.gz
  sha256: 5ea5fa718a4425b114db9e82ad9d7e6de726e0ef7f1a2f9d01574b6165c3e6dd

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=52.0.0
    - wheel >=0.36.2
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.19.2
    - scipy >=1.5.2
    - h5py >=3.5.0

test:
  imports:
    - fides
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/fides-dev/fides
  summary: python-based Trust Region Optimization toolbox
  license: BSD-3-Clause
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - renan-r-santos
